name: Auto Build YOLO INT8 Matrix

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Check upstream version
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_VER=$(curl -fsSL --retry 3 https://pypi.org/pypi/ultralytics/json | jq -er '.info.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))')
          echo "version=$LATEST_VER" >> "$GITHUB_OUTPUT"

          if gh release view "$LATEST_VER" --repo "$GITHUB_REPOSITORY" \
               --json assets,isDraft,isPrerelease > release.json \
             && python3 validate_artifacts.py --release-json release.json; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release absent or incomplete; rebuilding all models."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - yolo11s
          - yolo11m
          - yolo11l
          - yolo26s
          - yolo26m
          - yolo26l
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          ULTRALYTICS_VERSION: ${{ needs.check-upstream.outputs.version }}
        run: docker build --build-arg ULTRALYTICS_VERSION="$ULTRALYTICS_VERSION" -t yolo-builder .

      - name: Run OpenVINO build script
        env:
          MODEL_NAME: ${{ matrix.model }}
        run: |
          docker run --rm \
            -e MODEL_NAME=$MODEL_NAME \
            -v ${{ github.workspace }}:/app \
            yolo-builder python3 build_yolo_int8.py

      - name: Run RKNN build scripts (rk3568, rk3576, rk3588)
        env:
          MODEL_NAME: ${{ matrix.model }}
        run: |
          set -e
          for target in rk3568 rk3576 rk3588; do
            docker run --rm \
              -e MODEL_NAME=$MODEL_NAME \
              -e RKNN_TARGET=$target \
              -v ${{ github.workspace }}:/app \
              yolo-builder python3 build_yolo_rknn.py
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.model }}-zip
          path: |
            frigate_${{ matrix.model }}_int8_320.zip
            frigate_${{ matrix.model }}_rk3568_int8_320.zip
            frigate_${{ matrix.model }}_rk3576_int8_320.zip
            frigate_${{ matrix.model }}_rk3588_int8_320.zip
          if-no-files-found: error

  release:
    needs: [check-upstream, build]
    if: needs.check-upstream.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify all 24 model archives
        run: python3 validate_artifacts.py --directory artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-upstream.outputs.version }}
          name: Ultralytics ${{ needs.check-upstream.outputs.version }} - INT8 Models
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: artifacts/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
